<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>홈 | AIMaster</title>
    <link rel="stylesheet" href="/src/styles/reset.css" />
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
    <link rel="stylesheet" href="/src/styles/pages/home.css" />
  </head>
  <body>
    <!-- 공통 컴포넌트: Header (현재 메뉴: home) -->
    <header id="header" data-active="home"></header>

    <!-- PAGE 1. Home (메인) — 본문 틀: .page (폭 1200, 위 48 · 아래 80) -->
    <main id="main" class="page home">
      <!-- 1) Hero: 서비스 소개 (연한 배경 + 큰 제목 + 오른쪽 로고 이미지) -->
      <section class="hero">
        <h1 class="hero__title">AI, 처음부터 차근차근 배워 봐요</h1>
        <p class="hero__desc">
          비전공 대학생도 쉽게 따라 할 수 있도록 AI의 개념부터 활용법까지
          단계별로 안내해요.
        </p>
        <img
          class="hero__image"
          src="/images/hero-logo.png"
          alt=""
          aria-hidden="true"
        />
      </section>

      <!-- 2) 기능 카드 2개 (FeatureCard 큰 카드: feature-card--lg) -->
      <section class="home-cards grid-2" aria-label="주요 기능">
        <!-- 카드 1. AI 단계학습 -->
        <article class="feature-card feature-card--lg">
          <div class="feature-card__icon">
            <img src="/images/icons/book.png" alt="" width="75" height="75" />
          </div>
          <h2 class="feature-card__title">AI 단계학습</h2>
          <p class="feature-card__desc">
            AI 기본 개념부터 프롬프트, 결과 검증, 심화 기능까지 5단계로 차근차근
            배워요.
          </p>
          <div class="feature-card__actions">
            <a class="btn btn--primary btn--lg" href="/pages/learn/index.html"
              >학습 시작하기</a
            >
          </div>
        </article>

        <!-- 카드 2. 학업에 활용하기 -->
        <article class="feature-card feature-card--lg">
          <div class="feature-card__icon">
            <img
              src="/images/icons/graduate-cap.png"
              alt=""
              width="75"
              height="75"
            />
          </div>
          <h2 class="feature-card__title">학업에 활용하기</h2>
          <p class="feature-card__desc">
            글쓰기, 수학 문제 풀이, 강의 이해처럼 대학 생활에서 AI를 쓰는 방법과
            예시 프롬프트를 확인해요.
          </p>
          <div class="feature-card__actions">
            <a class="btn btn--primary btn--lg" href="/pages/study/index.html"
              >활용법 둘러보기</a
            >
          </div>
        </article>
      </section>
    </main>

    <!-- 공통 컴포넌트: Footer -->
    <footer id="footer"></footer>

    <script type="module" src="/src/pages/home.js"></script>
  </body>
</html>
